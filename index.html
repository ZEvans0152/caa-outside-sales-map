Object.keys(repColors).forEach(rep => {

  item.className = 'legend-item';
  item.innerHTML = '<span class="dot" style="background:' + repColors[rep] + '"></span>' + rep;
  legend.appendChild(item);
});

const map = L.map('map').setView([34.72811379310345, -82.33304827586207], 7);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  maxZoom: 19
}).addTo(map);

const repLayers = {};
Object.keys(repColors).forEach(rep => { repLayers[rep] = L.layerGroup().addTo(map); });

points.forEach(p => {
  const color = repColors[p.rep] || '#666';
  const radius = 6 + Math.min(p.n, 15);
  const dealerList = p.dealers.map(d => '<li>' + d + '</li>').join('');
  const popupHtml = '<b>' + p.rep + '</b><br>' + p.city + ', ' + p.state +
    '<br><b>' + p.n + ' visit' + (p.n > 1 ? 's' : '') + '</b>' +
    '<ul class="popup-dealers">' + dealerList + '</ul>';

    radius: radius, color: color, fillColor: color, fillOpacity: 0.75, weight: 1
  }).bindPopup(popupHtml, {maxWidth: 280});

});
